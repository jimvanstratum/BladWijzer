<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/BladWijzer/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141815" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' i.p.v. 'black-translucent': met een doorzichtige statusbalk geeft iOS 18 de
         geïnstalleerde app een viewport van schermhoogte min statusbalk, maar tekent die vanaf de
         bovenrand — de onderste ~59pt zijn dood gebied en de menubalk hangt boven de onderkant. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BladWijzer" />
    <link rel="apple-touch-icon" href="/BladWijzer/icon-192.png" />
    <title>BladWijzer</title>
